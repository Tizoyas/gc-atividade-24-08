name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Configurar npm
        run: npm install --global npm@11.17.0

      - name: Instalar dependencias
        run: npm ci

      - name: Executar build
        run: npm run build

      - name: Executar testes
        run: npm test

      - name: Verificar estrutura do pacote
        run: node scripts/verificar-dist.js

      - name: Gerar pacote distribuivel
        run: npm run package

      - name: Gerar checksum
        run: node scripts/checksum-release.js

      - name: Testar pacote extraido
        if: hashFiles('app/scripts/smoke-package.js') != ''
        run: node scripts/smoke-package.js

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: sistac-release-package
          path: |
            app/release/*.tar.gz
            app/release/SHA256SUMS.txt
          if-no-files-found: error
